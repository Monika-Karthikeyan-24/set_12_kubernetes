apiVersion: apps/v1
kind: Deployment
metadata:
  name: set12-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: set12-app
  template:
    metadata:
      labels:
        app: set12-app
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: set12-service
spec:
  type: NodePort
  selector:
    app: set12-app
  ports:
    - port: 80
      targetPort: 80